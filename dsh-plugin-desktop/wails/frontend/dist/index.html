<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DSH Desktop — Wails shell</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #06070f; color: #e8eaf2; }
    .panel { max-width: 720px; margin: 48px auto; padding: 24px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .muted { color: #9aa3b5; font-weight: 500; }
    .lead, .status { color: #b7c0d1; line-height: 1.5; }
    .field { display: flex; flex-direction: column; gap: 6px; margin: 20px 0; }
    input { padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3142; background: #121624; color: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; background: #3b82f6; color: white; cursor: pointer; }
    button.secondary { background: #243049; }
    button.danger { background: #b91c1c; }
    .log { margin-top: 20px; padding: 12px; background: #0d111c; border-radius: 8px; min-height: 96px; white-space: pre-wrap; font-size: 12px; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
<main class="panel">
  <h1>DSH Desktop <span class="muted">Wails v3 shell</span></h1>
  <p class="lead">Static control UI (no Vite). Prefer <code>frontend/</code> + <code>wails3 build</code> when the JS toolchain is available.</p>
  <p id="status" class="status">Checking shell…</p>
  <label class="field"><span>Host UI URL</span>
    <input id="host-url" type="url" placeholder="http://127.0.0.1:PORT/" autocomplete="off"/>
  </label>
  <div class="actions">
    <button id="btn-load" type="button">Load Host URL</button>
    <button id="btn-control" type="button" class="secondary">Control UI</button>
    <button id="btn-dir" type="button" class="secondary">Open Directory…</button>
    <button id="btn-about" type="button" class="secondary">About</button>
    <button id="btn-hide" type="button" class="secondary">Hide to tray</button>
    <button id="btn-quit" type="button" class="danger">Quit</button>
  </div>
  <pre id="log" class="log"></pre>
</main>
<script type="module">
import { Call } from "/wails/runtime.js";
const ID = {
  CurrentURL: 152939581,
  HideWindow: 1601551219,
  LoadHostURL: 2329620894,
  OpenDirectoryDialog: 338629742,
  Quit: 3900019188,
  ShowControlUI: 2225449553,
  ShowInfoDialog: 1571402046,
  Status: 1144694253,
};
const statusEl = document.getElementById("status");
const hostUrlEl = document.getElementById("host-url");
const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent = `[${new Date().toISOString()}] ${msg}\n` + (logEl.textContent || "");
}
async function refresh() {
  try {
    statusEl.textContent = await Call.ByID(ID.Status);
    const current = await Call.ByID(ID.CurrentURL);
    if (current && !hostUrlEl.value) hostUrlEl.value = current;
  } catch (err) {
    statusEl.textContent = "Shell unavailable: " + err;
  }
}
document.getElementById("btn-load").onclick = async () => {
  const url = hostUrlEl.value.trim();
  if (!url) return log("Enter a Host UI URL first.");
  await Call.ByID(ID.LoadHostURL, url);
  log("Navigated to " + url);
  await refresh();
};
document.getElementById("btn-control").onclick = () => Call.ByID(ID.ShowControlUI).then(refresh);
document.getElementById("btn-dir").onclick = async () => {
  try {
    const path = await Call.ByID(ID.OpenDirectoryDialog);
    log(path ? "Selected: " + path : "Cancelled");
  } catch (err) { log(String(err)); }
};
document.getElementById("btn-about").onclick = () => Call.ByID(
  ID.ShowInfoDialog,
  "DSH Desktop",
  "Wails v3 native shell.\\nCordis Host remains a Node sidecar during the hybrid migration.",
);
document.getElementById("btn-hide").onclick = () => Call.ByID(ID.HideWindow);
document.getElementById("btn-quit").onclick = () => Call.ByID(ID.Quit);
refresh();
</script>
</body>
</html>
